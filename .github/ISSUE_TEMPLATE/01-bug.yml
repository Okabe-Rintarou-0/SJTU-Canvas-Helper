name: 问题反馈
description: 报告使用中遇到的问题或咨询使用方法。
title: "[Bug] "
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请告诉我们你遇到了什么问题，以及当时做了哪些操作。方便的话，也可以附上截图。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息（可选）
      description: |
        1. 点击侧栏底部的“反馈”，或前往“系统设置 → 工具与诊断 → 日志与反馈”。
        2. 在弹出的窗口中点击“导出诊断信息”并保存。日常日志默认记录，无需开启 Debug 模式。
        3. 将保存的 .txt 文件拖入下方输入框，等待上传完成。

        应用打不开或找不到导出按钮时，可跳过此项。附件会公开，上传前请检查是否含有个人信息。
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 应用版本与系统（可选）
      description: |
        在“日志与反馈”窗口点击“复制环境信息”，粘贴到这里。窗口可从侧栏底部的“反馈”或“系统设置 → 工具与诊断 → 日志与反馈”打开。已上传诊断文件或已自动填写时，可跳过。
    validations:
      required: false
