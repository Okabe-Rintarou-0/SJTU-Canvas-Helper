name: 问题反馈
description: 报告使用中遇到的问题或咨询使用方法。
title: "[Bug] "
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请告诉我们你遇到了什么问题，以及当时做了哪些操作。方便的话，也可以附上截图。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息（可选）
      description: |
        1. 在应用左侧点击“反馈”，在“日志与反馈”窗口中点击“导出诊断信息”并保存。
        2. 将保存的 .txt 文件拖入下方输入框，等待上传完成。

        应用打不开或找不到导出按钮时，可跳过此项。附件会公开，上传前请检查是否含有个人信息。
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 应用版本与系统（可选）
      description: |
        在应用左侧点击“反馈”→“复制环境信息”，粘贴到这里。已上传诊断文件或已自动填写时，可跳过。
    validations:
      required: false
