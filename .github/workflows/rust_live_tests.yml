name: Rust live integration tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: "./src-tauri -> target"
          key: live-ubuntu
      - uses: taiki-e/install-action@nextest
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev patchelf
      - name: Run live Canvas and authentication checks
        run: >-
          cargo nextest run --locked --workspace --profile live --run-ignored only
          -E 'test(/^client::basic::test::/) | test(/^client::video::tests::test_get_uuid$/)'
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
      - name: Upload live test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-live.xml
          path: src-tauri/target/nextest/live/junit.xml
