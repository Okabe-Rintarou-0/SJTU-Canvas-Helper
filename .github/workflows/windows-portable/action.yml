name: 'Windows Portable Action'
description: 'A composite action for the Windows Portable Bundle workflow'
inputs:
  working-directory:
    description: 'Relative path of the working directory'
    required: false
    default: '.'
  target:
    description: 'The target to build for'
    required: false
    default: 'x86_64-pc-windows-msvc'
  version-template:
    description: 'The version template to use'
    required: false
    default: 'v__VERSION__'
runs:
  using: "composite"
  steps:
    - name: Print working directory
      run: echo "$PWD"
      shell: bash

    - name: Test portable packaging
      run: node --test ./.github/workflows/windows-portable/portable-archive.test.mjs
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Build
      run: yarn tauri build --no-bundle --target ${{ inputs.target }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Bundle and upload
      run: node ./.github/workflows/windows-portable/portable.mjs ${{ inputs.target }} ${{ inputs.version-template }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
